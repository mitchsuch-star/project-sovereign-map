<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300">
<!-- Duchy of Normandy: gules, two leopards passant guardant or. Original
     geometric rendering for this project (Public Domain). Deliberately bold
     and simplified: the charges must still read as animals at chip size,
     where the fine-line artwork used for Hanover collapses into a smudge. -->
<rect fill="#c8102e" width="500" height="300"/>
<defs>
  <g id="leopard" fill="#e8b923" stroke="#7a5c0c" stroke-width="3.5" stroke-linejoin="round">
    <!-- tail: up from the haunch and curled forward over the back -->
    <path d="M-84,-6 C-112,-16 -122,-52 -100,-66 C-86,-74 -72,-62 -78,-52
             C-82,-46 -92,-48 -90,-56"
          fill="none" stroke-width="9" stroke-linecap="round"/>
    <!-- body with four legs -->
    <path d="M-86,2 C-86,-20 -70,-32 -44,-32 L20,-32 C40,-32 52,-22 56,-8
             L56,12 L40,12 L40,44 L26,44 L26,12 L2,12 L2,44 L-12,44 L-12,12
             L-42,12 L-42,44 L-56,44 L-56,12 L-72,12 L-72,44 L-86,44 Z"/>
    <!-- raised foreleg, the passant gait -->
    <path d="M52,4 C66,6 74,18 70,32 L56,30 C58,20 56,12 48,10 Z"/>
    <!-- head, turned to face the viewer (guardant) -->
    <path d="M42,-58 L48,-76 L60,-62 Z"/>
    <path d="M78,-62 L90,-76 L92,-56 Z"/>
    <circle cx="66" cy="-40" r="26"/>
    <!-- muzzle -->
    <circle cx="66" cy="-30" r="9" fill="#7a5c0c" stroke="none"/>
    <!-- eyes -->
    <circle cx="56" cy="-48" r="4" fill="#7a5c0c" stroke="none"/>
    <circle cx="76" cy="-48" r="4" fill="#7a5c0c" stroke="none"/>
  </g>
</defs>
<use href="#leopard" transform="translate(250,96) scale(0.85)"/>
<use href="#leopard" transform="translate(250,236) scale(0.85)"/>
</svg>
