<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300">
<!-- Duchy of Normandy: gules, two leopards passant guardant or. Original
     geometric rendering for this project (Public Domain) - deliberately bold
     and simplified so the charges still read at chip size, where the sourced
     fine-line artwork used for Hanover would collapse into a smudge. -->
<rect fill="#c8102e" width="500" height="300"/>
<g fill="#e8b923" stroke="#7a5c0c" stroke-width="4" stroke-linejoin="round">
  <!-- upper leopard -->
  <g transform="translate(250,88)">
    <path d="M-96,26 L-96,4 C-96,-8 -84,-16 -70,-16 L34,-16 C46,-16 56,-8 56,4 L56,26 L40,26 L40,12 L26,12 L26,26 L10,26 L10,12 L-4,12 L-4,26 L-20,26 L-20,12 L-34,12 L-34,26 L-50,26 L-50,12 L-64,12 L-64,26 Z"/>
    <path d="M56,4 C56,-14 70,-28 88,-28 C98,-28 96,-16 92,-10 L98,-4 L88,2 L92,12 L78,10 C68,14 56,12 56,4 Z"/>
    <circle fill="#7a5c0c" stroke="none" cx="84" cy="-16" r="4"/>
    <path d="M-96,10 L-116,-14 L-104,-16 L-96,-4 Z"/>
  </g>
  <!-- lower leopard -->
  <g transform="translate(250,212)">
    <path d="M-96,26 L-96,4 C-96,-8 -84,-16 -70,-16 L34,-16 C46,-16 56,-8 56,4 L56,26 L40,26 L40,12 L26,12 L26,26 L10,26 L10,12 L-4,12 L-4,26 L-20,26 L-20,12 L-34,12 L-34,26 L-50,26 L-50,12 L-64,12 L-64,26 Z"/>
    <path d="M56,4 C56,-14 70,-28 88,-28 C98,-28 96,-16 92,-10 L98,-4 L88,2 L92,12 L78,10 C68,14 56,12 56,4 Z"/>
    <circle fill="#7a5c0c" stroke="none" cx="84" cy="-16" r="4"/>
    <path d="M-96,10 L-116,-14 L-104,-16 L-96,-4 Z"/>
  </g>
</g>
</svg>
